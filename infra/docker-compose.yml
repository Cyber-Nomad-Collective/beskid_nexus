# Coolify / standalone repo (see ../COOLIFY.md). Build context is the repository root.
services:
  nexus:
    build:
      context: ..
      dockerfile: Dockerfile
      additional_contexts:
        openspec: ${NEXUS_OPEN_SPEC_CONTEXT:-../../openspec}
    restart: unless-stopped
    ports:
      # Caddy is the only public entry point. Do not expose Nexus directly.
      - "127.0.0.1:8452:8452"
    environment:
      GITNEXUS_HOME: /data/gitnexus
      NEXUS_MCP_AUTH_TOKEN: ${NEXUS_MCP_AUTH_TOKEN:-}
      PORT: "8452"
      GITNEXUS_SERVE_HOST: "0.0.0.0"
      # Caddy forward_auth must copy X-Authentik-{Username,Name,Email,Groups}.
      NEXUS_AUTHENTIK_ADMIN_GROUPS: ${NEXUS_AUTHENTIK_ADMIN_GROUPS:-nexus-admin}
      NEXUS_AUTHENTIK_ADMIN_USERS: ${NEXUS_AUTHENTIK_ADMIN_USERS:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      NEXUS_OPEN_SPEC_CATALOG: ${NEXUS_OPEN_SPEC_CATALOG:-/app/openspec/catalog.json}
    volumes:
      - nexus-data:/data/gitnexus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8452/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  nexus-data:
